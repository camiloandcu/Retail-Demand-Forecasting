[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-forecast"
version = "0.1.0"
description = "Reproducible multi-horizon retail demand forecasting pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]
notebook = [
  "ipykernel>=6,<8",
  "kagglehub>=1.0.2,<2",
  "matplotlib>=3.8,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]

[project.scripts]
retail-forecast = "retail_forecast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
