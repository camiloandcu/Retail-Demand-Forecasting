name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    # Pinned image; move deliberately rather than with the ubuntu-latest label.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.12.0"
      - name: Fetch pinned notebook revisions
        # Squash merges leave pins reachable only by PR refs, which checkout skips.
        run: python3 scripts/fetch_notebook_revisions.py
      - name: Check lock metadata
        run: uv lock --check
      - name: Install
        run: uv sync --extra dev --extra notebook --frozen
      - name: Verify generated notebook constraints
        run: uv run --frozen python scripts/export_notebook_constraints.py --check
      - name: Lint and format check
        run: make lint
      - name: Unit tests
        run: make test
      - name: Synthetic batch inference
        run: uv run --frozen retail-forecast smoke --config configs/smoke.yaml > "${RUNNER_TEMP}/retail-smoke-result.json"
      - name: Verify returned completed submission
        run: uv run --frozen python scripts/verify_run_result.py "${RUNNER_TEMP}/retail-smoke-result.json" --mode smoke --source synthetic
