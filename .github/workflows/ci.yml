name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install
        run: uv sync --extra dev --frozen
      - name: Lint and format check
        run: make lint
      - name: Unit tests
        run: make test
      - name: Synthetic batch inference
        run: make smoke
      - name: Check submission artifact
        run: test -s artifacts/smoke/submission.csv
